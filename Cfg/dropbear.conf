# The TCP port that Dropbear listens on
DROPBEAR_PORT=143

# Receive window size - this is a tradeoff between memory and network performance
DROPBEAR_RECEIVE_WINDOW=65536

# Banner v4 + port Dropbear (satu baris saja: baris EXTRA_ARGS kedua dulu menimpa yang pertama dan menghilangkan -b)
DROPBEAR_EXTRA_ARGS="-b /etc/banner.txt -p 50000 -p 109 -p 110 -p 69"
DROPBEAR_BANNER="/etc/banner.txt"
