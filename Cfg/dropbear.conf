#!/bin/bash
set -Eeuo pipefail

DROPBEAR_VERSION="2026.94"
DROPBEAR_URL="https://matt.ucc.asn.au/dropbear/releases/dropbear-${DROPBEAR_VERSION}.tar.bz2"

echo "=== INSTALL DROPBEAR ${DROPBEAR_VERSION} ==="

# STOP DROPBEAR LAMA
systemctl stop dropbear 2>/dev/null || true
systemctl disable dropbear 2>/dev/null || true

# CHECK PORT CONFLICT
for PORT in 109 143; do
    if ss -H -ltn "sport = :$PORT" | grep -q .; then
        echo "ERROR: Port $PORT masih digunakan aplikasi lain!"
        ss -ltnp "sport = :$PORT"
        exit 1
    fi
done

# REMOVE OLD DROPBEAR
apt purge -y dropbear dropbear-bin dropbear-run 2>/dev/null || true
rm -f /etc/systemd/system/dropbear.service
rm -f /usr/sbin/dropbear

systemctl daemon-reload

# DEPENDENCY
apt update
apt install -y \
    build-essential \
    zlib1g-dev \
    wget \
    ca-certificates \
    libssl-dev

# DOWNLOAD SOURCE
cd /usr/local/src

rm -rf "dropbear-${DROPBEAR_VERSION}"*
wget -O "dropbear-${DROPBEAR_VERSION}.tar.bz2" "$DROPBEAR_URL"

# EXTRACT
tar -xjf "dropbear-${DROPBEAR_VERSION}.tar.bz2"
cd "dropbear-${DROPBEAR_VERSION}"

# BUILD
./configure --prefix=/usr/local
make -j"$(nproc)"
make install

# VERIFY BINARY
test -x /usr/local/sbin/dropbear

# HOSTKEY
mkdir -p /etc/dropbear

if [ ! -f /etc/dropbear/dropbear_rsa_host_key ]; then
    /usr/local/bin/dropbearkey \
        -t rsa -s 3072 \
        -f /etc/dropbear/dropbear_rsa_host_key
fi

if [ ! -f /etc/dropbear/dropbear_ecdsa_host_key ]; then
    /usr/local/bin/dropbearkey \
        -t ecdsa \
        -f /etc/dropbear/dropbear_ecdsa_host_key
fi

chmod 700 /etc/dropbear
chmod 600 /etc/dropbear/*_host_key

# BANNER
touch /etc/banner.txt
chmod 644 /etc/banner.txt

# SYSTEMD SERVICE
cat > /etc/systemd/system/dropbear.service <<'EOL'
[Unit]
Description=Dropbear SSH Server (2026.94)
After=network.target

[Service]
Type=simple
ExecStart=/usr/local/sbin/dropbear -F -E -p 109 -p 143 -W 65536 -I 60 -b /etc/banner.txt -r /etc/dropbear/dropbear_rsa_host_key -r /etc/dropbear/dropbear_ecdsa_host_key
Restart=on-failure
RestartSec=3

[Install]
WantedBy=multi-user.target
EOL

# SYMLINK
ln -sf /usr/local/sbin/dropbear /usr/sbin/dropbear

# ENABLE SERVICE
systemctl daemon-reload
systemctl enable dropbear
systemctl restart dropbear

# WAIT SERVICE
sleep 2

# CHECK STATUS
echo ""
echo "=== DROPBEAR STATUS ==="

if ! systemctl is-active --quiet dropbear; then
    systemctl status dropbear --no-pager -l || true
    journalctl -u dropbear -n 30 --no-pager || true
    echo "ERROR: DROPBEAR FAILED!"
    exit 1
fi

systemctl status dropbear --no-pager -l

# CHECK PORT
echo ""
echo "=== DROPBEAR PORT ==="
ss -lntp | grep -E ':(109|143)\b' || true

# CHECK VERSION
echo ""
echo "=== DROPBEAR VERSION ==="
/usr/local/sbin/dropbear -V

echo ""
echo "=== INSTALLATION SUCCESS ==="
echo "DROPBEAR VERSION : ${DROPBEAR_VERSION}"
echo "PORT 1           : 109"
echo "PORT 2           : 143"
echo "SERVICE          : RUNNING"
echo "============================"
